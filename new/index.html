    <style>
        :root {
            --bg-color: #f0fdf4;
            --surface-color: #ffffff;
            --surface-hover: #dcfce7;
            --primary-color: #22c55e;
            --primary-hover: #16a34a;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --warning-hover: #d97706;
            --text-color: #1e293b;
            --text-secondary: #64748b;
            --border-color: #bbf7d0;
            --accent-color: #0ea5e9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1515px;
            margin: 0 auto;
            align-items: center;
        }

        .top-section {
            display: flex;
            gap: 20px;
            width: 100%;
            align-items: flex-start;
        }

        .top-left {
            flex: 0 0 75%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .top-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-panel {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--surface-color);
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
            margin-bottom: 0 !important;
            max-width: none !important;
        }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #timer_display {
            font-size: 56px;
            font-weight: 900;
            color: var(--danger-color);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            letter-spacing: 2px;
        }

        .controls-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .judge-panel {
            background-color: var(--surface-color);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
            box-sizing: border-box;
            border: 2px solid var(--border-color);
            max-width: none !important;
            margin-bottom: 0 !important;
        }

        .slides-container {
            width: 100%;
            max-width: calc(75vh * 16 / 9);
            max-height: 75vh;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            border: 2px solid var(--accent-color);
            position: relative;
            margin: 0 auto;
        }

        .slides-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .players-grid {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            gap: 1.5rem;
            width: 100%;
            margin-top: 0 !important;
            max-width: none !important;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        button {
            background-color: var(--surface-hover);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--border-color);
            border-color: var(--primary-color);
        }

        button.primary {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
        }

        button.primary:hover {
            background-color: var(--primary-hover);
        }

        button.danger {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }

        button.danger:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        #alarm {
            color: var(--warning-color);
            font-weight: bold;
            height: 24px;
            margin-bottom: 10px;
        }

        .judges-grid {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: nowrap;
        }

        .pon-box {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pon-box[data-status="done"] {
            transform: scale(1.2);
            filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.6));
        }

        .big-score {
            font-size: 8rem;
            font-weight: 900;
            color: var(--text-color);
            line-height: 1;
            margin: 1rem 0;
            text-shadow: 0 0 40px rgba(0, 0, 0, 0.1);
            min-height: 8rem;
        }

        .big-score.calculated {
            color: var(--success-color);
            text-shadow: 0 0 40px rgba(34, 197, 94, 0.3);
            transform: scale(1.05);
            transition: all 0.4s ease;
        }

        .player-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem 1rem;
            text-align: center;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1 1 0;
            min-width: 150px;
        }

        .player-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-5px);
        }

        .player-sum {
            font-size: 36px;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        .player-name {
            font-size: 28px;
            color: var(--text-color);
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        dialog {
            background-color: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 500px;
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
        }

        dialog h3 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        select {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            border-radius: 8px;
            width: 100%;
            margin-bottom: 1rem;
            outline: none;
            font-size: 1rem;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 1.5rem;
        }

        .player-gauge {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.05);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }

        .liquid {
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, var(--accent-color), var(--primary-color));
            transition: height 1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }

        .liquid::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            filter: blur(2px);
        }

        body[data-show-gauge="false"] .player-gauge {
            display: none;
        }
    </style>

    <script>
        // --- Sound Effects ---
        let audioCtx = null;
        const ponSound = new Audio('pon.mp3');
        const myonSound = new Audio('myon.mp3');
        const startSound = new Audio('start.mp3');
        const hundredSound = new Audio('hundred.mp3');

        // 音量をデフォルト(1.0)から少し下げる
        ponSound.volume = 0.4;
        myonSound.volume = 0.4;
        startSound.volume = 0.4;
        hundredSound.volume = 0.4;

        function initAudio() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {
                console.error("Audio initialization failed:", e);
            }
        }

        function playTick(freq = 880) {
            try {
                initAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(now + 0.1);
            } catch (e) { }
        }

        function playShing() {
            try {
                initAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(3520, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(now + 1.2);

                const osc2 = audioCtx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1760, now);
                const gain2 = audioCtx.createGain();
                gain2.gain.setValueAtTime(0.1, now);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 2.0);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start();
                osc2.stop(now + 2.0);
            } catch (e) { }
        }

        function play100() {
            try {
                hundredSound.currentTime = 0;
                hundredSound.play().catch(e => console.log(e));
            } catch (e) { }
        }

        function playDepressed() {
            try {
                myonSound.currentTime = 0;
                myonSound.play().catch(e => console.log(e));
            } catch (e) { }
        }

        function playPon() {
            try {
                ponSound.currentTime = 0;
                ponSound.play().catch(e => console.log(e));
            } catch (e) { }
        }

        function playBuzz() {
            try {
                initAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.001, now + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(now + 0.3);
            } catch (e) { }
        }

        function animateNumber(element, start, end, duration, onComplete) {
            if (element._animId) {
                cancelAnimationFrame(element._animId);
            }
            let startTimestamp = null;
            const diff = end - start;
            if (diff === 0 && start !== 0) {
                element.innerText = end;
                if (onComplete) onComplete();
                return;
            }

            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const current = Math.floor(progress * diff + start);

                if (element.innerText !== String(current)) {
                    element.innerText = current;
                    if (diff > 0) playTick(440 + (current % 81) * 10);
                }

                if (progress < 1) {
                    element._animId = window.requestAnimationFrame(step);
                } else {
                    element.innerText = end;
                    element._animId = null;
                    if (onComplete) onComplete();
                }
            };
            element._animId = window.requestAnimationFrame(step);
        }

        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyv89MPyo1SDdaimgmednqDcUD6jQf4T-l9gFds9g6k3nX9fB7mgoI1uI4oC2eGEZ2O/exec";

        async function callGas(action, payload) {
            if (GAS_WEBAPP_URL.includes("ここにGASでデプロイした")) return { success: false, error: "GAS_WEBAPP_URL is not set" };
            try {
                const response = await fetch(GAS_WEBAPP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: action, data: payload })
                });
                return await response.json();
            } catch (error) {
                console.error("Error calling GAS:", error);
                return { success: false, error: error };
            }
        }

        let firebaseConfig = {

        let db;

        const STORAGE_KEY = 'ogiri_system_data';

        function saveState() {
            const state = {
                maxPlayers,
                judgeCount,
                defaultTimerMinutes,
                playerNames: [],
                playerScores: []
            };
            for (let i = 1; i <= 6; i++) {
                const nameEl = document.getElementById('player_name' + i);
                const scoreEl = document.getElementById('sum_score' + i);
                state.playerNames.push(nameEl ? nameEl.innerText : "----");
                state.playerScores.push(scoreEl ? scoreEl.innerText : "0");
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return null;
            try {
                return JSON.parse(saved);
            } catch (e) {
                return null;
            }
        }

        const savedData = loadState();
        if (savedData) {
            maxPlayers = savedData.maxPlayers || 6;
            judgeCount = savedData.judgeCount || 4;
            defaultTimerMinutes = savedData.defaultTimerMinutes || 5;
            timeLeft = defaultTimerMinutes * 60;
        }

        let displayElement = document.getElementById('display');
        let alarmElement = document.getElementById('alarm');

        function renderPons() {
            const container = document.getElementById('pons_container');
            container.innerHTML = '';
            for (let i = 1; i <= judgeCount; i++) {
                const box = document.createElement('div');
                box.className = 'pon-box';
                box.id = 'pon' + i;
                box.innerHTML = '<span style="color: var(--surface-hover);">●</span>';
                container.appendChild(box);
            }
        }

        function renderPlayers() {
            const playerContainer = document.getElementById('main_player_container');
            const modalContainer = document.getElementById('modal_player_container');

            const saved = loadState();
            let currentNames = saved ? saved.playerNames : [];
            let currentScores = saved ? saved.playerScores : [];

            if (currentNames.length === 0) {
                for (let i = 1; i <= 6; i++) {
                    currentNames.push("----");
                    currentScores.push("0");
                }
            }

            playerContainer.innerHTML = '';
            modalContainer.innerHTML = '';

            for (let i = 1; i <= maxPlayers; i++) {
                const pcard = document.createElement('div');
                pcard.className = 'player-card';
                const scoreVal = Number(currentScores[i - 1]) || 0;
                pcard.innerHTML = `
                    <div class="player-gauge">
                        <div class="liquid" id="liquid${i}" style="height: ${Math.min(100, (scoreVal / 300) * 100)}%"></div>
                    </div>
                    <div>
                        <div class="player-sum" id="sum_score${i}">${scoreVal}</div>
                        <div class="player-name" id="player_name${i}">${currentNames[i - 1]}</div>
                    </div>
                    <button class="primary" type="button" onclick="point_register(${i})">登録</button>
                `;
                playerContainer.appendChild(pcard);

                const mbox = document.createElement('label');
                mbox.style.display = 'flex';
                mbox.style.justifyContent = 'space-between';
                mbox.style.alignItems = 'center';

                let optionsHtml = '<option value="----" ' + (currentNames[i - 1] === "----" ? "selected" : "") + '>----</option>';
                let nameFound = false;
                availableNames.forEach(name => {
                    const isSelected = name === currentNames[i - 1];
                    if (isSelected) nameFound = true;
                    optionsHtml += `<option value="${name}" ${isSelected ? 'selected' : ''}>${name}</option>`;
                });

                if (currentNames[i - 1] !== "----" && !nameFound) {
                    optionsHtml += `<option value="${currentNames[i - 1]}" style="display:none;" selected>${currentNames[i - 1]}</option>`;
                }

                mbox.innerHTML = `
                    プレイヤー${i}:
                    <select id="player_select${i}" style="width: 70%; margin-bottom: 0;">
                        ${optionsHtml}
                    </select>
                `;
                modalContainer.appendChild(mbox);
            }
        }

        function initializeFirebase() {
            if (typeof firebase !== 'undefined') {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                setupFirebaseListeners();
            } else {
                setTimeout(initializeFirebase, 100);
            }
        }

        function setupFirebaseListeners() {
            for (let i = 1; i <= maxJudgesSystem; i++) {
                db.ref('shared_value' + i).on('value', (snapshot) => {
                    let val = snapshot.val();
                    data[i - 1] = val;
                    if (val && i <= judgeCount) {
                        setPon(i, true);
                        calculateAndShow();
                    } else if (!val && i <= judgeCount) {
                        setPon(i, false);
                        calculateAndShow();
                    }
                });
            }
        }

        function setPon(judge_num, active) {
            let ponElement = document.getElementById('pon' + judge_num);
            if (ponElement) {
                if (active) {
                    if (ponElement.getAttribute('data-status') !== 'done') {
                        playPon();
                    }
                    ponElement.innerHTML = '<span style="color: var(--success-color);">●</span>';
                    ponElement.setAttribute('data-status', 'done');
                } else {
                    ponElement.innerHTML = '<span style="color: var(--surface-hover);">●</span>';
                    ponElement.removeAttribute('data-status');
                }
            }
        }

        const calculateAndShow = () => {
            let currentScores = data.slice(0, judgeCount);
            if (currentScores.every(val => val !== "" && val !== null && val !== undefined)) {
                const validScores = currentScores.map((s, i) => ({ value: Number(s), index: i }));
                const sum = validScores.reduce((a, b) => a + b.value, 0);

                let excludedIndices = [];
                if (judgeCount > 4) {
                    const excludeCount = judgeCount - 4;
                    const withDistances = validScores.map(s => ({
                        ...s,
                        distInt: Math.abs(s.value * judgeCount - sum)
                    }));

                    withDistances.sort((a, b) => {
                        if (b.distInt !== a.distInt) return b.distInt - a.distInt;
                        return a.value - b.value;
                    });

                    excludedIndices = withDistances.slice(0, excludeCount).map(e => e.index);
                }

                let finalProduct = 1;
                validScores.forEach(s => {
                    if (!excludedIndices.includes(s.index)) {
                        finalProduct *= s.value;
                    }
                });

                if (enableAllThreeIsHundred && judgeCount > 4 && validScores.every(s => s.value === 3)) {
                    finalProduct = 100;
                }

                const oldVal = isNaN(parseInt(displayElement.innerText)) ? 0 : parseInt(displayElement.innerText);
                if (oldVal !== finalProduct) {
                    animateNumber(displayElement, oldVal, finalProduct, 800, () => {
                        if (enableSpecialSounds) {
                            if (finalProduct === 81) playShing();
                            if (finalProduct === 100) play100();
                            if (finalProduct === 1) playDepressed();
                        }
                    });
                }
                displayElement.classList.add('calculated');
            } else {
                displayElement.innerText = "";
                displayElement.classList.remove('calculated');
            }
        };

        function point_register(player_number) {
            let currentScores = data.slice(0, judgeCount);
            if (currentScores.every(val => val !== "" && val !== null && val !== undefined)) {
                let time = new Date();
                let timestamp = String(time.getHours()).padStart(2, '0') + ":" + String(time.getMinutes()).padStart(2, '0');

                let selected_player = document.getElementById("player_name" + player_number).innerText;
                let score = Number(displayElement.innerText);
                const sum_scoreElement = document.getElementById('sum_score' + player_number);

                const oldSum = Number(sum_scoreElement.innerText) || 0;
                const newSum = Number(score) + oldSum;

                animateNumber(sum_scoreElement, oldSum, newSum, 600, () => {
                    saveState();
                });

                const liquid = document.getElementById('liquid' + player_number);
                if (liquid) {
                    liquid.style.height = Math.min(100, (newSum / 300) * 100) + "%";
                }

                let result = [timestamp, selected_player, score, "合計:" + newSum, "審査点:"].concat(currentScores);
                callGas("saveData", result);

                lastAction.playerNum = player_number;
                lastAction.score = score;
                resetCurrentRound();
            } else {
                playBuzz();
                alarmElement.innerText = "採点が終わっていません";
                setTimeout(() => { alarmElement.innerText = ""; }, 2000);
            }
        }

        function resetCurrentRound() {
            if (displayElement._animId) {
                cancelAnimationFrame(displayElement._animId);
                displayElement._animId = null;
            }
            displayElement.innerText = "";
            displayElement.classList.remove('calculated');
            data = ["", "", "", "", "", ""];
            for (let i = 1; i <= maxJudgesSystem; i++) {
                setPon(i, false);
                db.ref("shared_value" + i).set("");
            }
        }

        function undo() {
            if (data.some(val => val !== "" && val !== null && val !== undefined)) {
                resetCurrentRound();
            } else {
                if (lastAction.playerNum === null) {
                    playBuzz();
                    alert("取り消せる操作がありません。");
                    return;
                }
                if (confirm("直前の得点登録を取り消しますか？")) {
                    const targetScoreElement = document.getElementById('sum_score' + lastAction.playerNum);
                    let currentSum = Number(targetScoreElement.innerText);
                    const newSum = currentSum - lastAction.score;
                    targetScoreElement.innerText = newSum;

                    const liquid = document.getElementById('liquid' + lastAction.playerNum);
                    if (liquid) {
                        liquid.style.height = Math.min(100, (newSum / 300) * 100) + "%";
                    }

                    callGas("undoLastRow", null);
                    lastAction.playerNum = null;
                    lastAction.score = 0;
                    saveState();
                    alert("取り消しました。");
                }
            }
            callGas("saveData", ["undoしました"]);
        }

        function reset() {
            if (confirm("全てのスコアを本当に0にリセットしますか？")) {
                let playername_csv = [];
                let score_csv = [];
                for (let i = 1; i <= maxPlayers; i++) {
                    playername_csv.push(document.getElementById("player_name" + i).innerText);
                    score_csv.push(document.getElementById("sum_score" + i).innerText);
                }
                callGas("saveCsv", [playername_csv, score_csv]);

                resetCurrentRound();
                for (let i = 1; i <= maxPlayers; i++) {
                    let sum_scoreElement = document.getElementById('sum_score' + i);
                    if (sum_scoreElement) sum_scoreElement.innerText = 0;
                    let liquid = document.getElementById('liquid' + i);
                    if (liquid) liquid.style.height = "0%";
                }
                lastAction = { playerNum: null, score: 0 };

                clearInterval(TimerInterval);
                TimerRunning = false;
                timeLeft = defaultTimerMinutes * 60;
                document.getElementById('timer_display').innerText = String(defaultTimerMinutes).padStart(2, '0') + ":00";
                const btn = document.getElementById('timer_button');
                if (btn) {
                    btn.innerText = "開始";
                    btn.className = "primary";
                }
                localStorage.removeItem(STORAGE_KEY);
            }
        }

        const settingsModal = document.getElementById('settingsModal');
        const nameModal = document.getElementById('nameModal');
        const explain = document.getElementById('explain');

        function openSettings() { settingsModal.showModal(); }
        function closeSettings() {
            const slideInput = document.getElementById('slide_url_input').value.trim();
            if (slideInput) {
                if (!slideInput.toLowerCase().startsWith("<iframe")) {
                    alert("スライドのリンクは「<iframe」から始まる埋め込みコードを入力してください。");
                    return;
                }
                let newUrl = "";
                const match = slideInput.match(/src="([^"]+)"/);
                if (match && match[1]) {
                    newUrl = match[1];
                }

                if (newUrl) {
                    const iframe = document.getElementById('slide_iframe');
                    if (iframe && iframe.src !== newUrl) {
                        iframe.src = newUrl;
                    }
                    localStorage.setItem('savedSlideInput', slideInput);
                } else {
                    alert("有効なURLが見つかりませんでした。正しい埋め込みコードを確認してください。");
                    return;
                }
            } else {
                localStorage.removeItem('savedSlideInput');
            }
            settingsModal.close();
        }

        function changePlayerCount() {
            maxPlayers = parseInt(document.getElementById('player_count_select').value, 10);
            saveState();
            renderPlayers();
        }

        function changeTimerCount() {
            defaultTimerMinutes = parseInt(document.getElementById('timer_count_select').value, 10);
            saveState();
            if (!TimerRunning) {
                timeLeft = defaultTimerMinutes * 60;
                document.getElementById('timer_display').innerText = String(defaultTimerMinutes).padStart(2, '0') + ":00";
            }
        }

        function changeJudgeCount() {
            const newJudgeCount = parseInt(document.getElementById('judge_count_select').value, 10);
            if (newJudgeCount !== judgeCount) {
                if (confirm("審査員人数を変更します。現在の入力途中のスコアはリセットされますがよろしいですか？")) {
                    judgeCount = newJudgeCount;
                    saveState();
                    renderPons();
                    resetCurrentRound();
                } else {
                    document.getElementById('judge_count_select').value = judgeCount;
                }
            }
        }

        function toggleSounds() {
            enableSpecialSounds = document.getElementById('sound_effect_toggle').checked;
            localStorage.setItem('enableSpecialSounds', enableSpecialSounds);
        }

        function toggleGauge() {
            showGauge = document.getElementById('gauge_toggle').checked;
            localStorage.setItem('showGauge', showGauge);
            document.body.setAttribute('data-show-gauge', showGauge);
        }

        function toggleAllThreeHundred() {
            enableAllThreeIsHundred = document.getElementById('all_three_hundred_toggle').checked;
            localStorage.setItem('enableAllThreeIsHundred', enableAllThreeIsHundred);
        }

        function loadNamesFromCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const buffer = e.target.result;
                let text = new TextDecoder('utf-8').decode(buffer);
                if (text.includes('')) {
                    text = new TextDecoder('shift-jis').decode(buffer);
                }

                const names = text.split(/[\r\n,]+/).map(n => n.trim().replace(/^"|"$/g, '')).filter(n => n.length > 0);
                if (names.length > 0) {
                    availableNames = names;
                    localStorage.setItem('ogiri_available_names', JSON.stringify(availableNames));
                    renderPlayers();
                    alert("名前リストを更新しました。");
                } else {
                    alert("有効な名前が見つかりませんでした。");
                }
                event.target.value = "";
            };
            reader.readAsArrayBuffer(file);
        }

        function openNameModal() { nameModal.showModal(); }
        function closeNameModal() { nameModal.close(); }

        function selectName() {
            for (let i = 1; i <= maxPlayers; i++) {
                let sel = document.getElementById("player_select" + i);
                if (sel && sel.value !== "----") {
                    document.getElementById("player_name" + i).innerText = sel.value;
                }
            }
            saveState();
            nameModal.close();
        }

        function openExplain() { explain.showModal(); }
        function closeExplain() { explain.close(); }

        async function csv_register() {
            let playername_csv = [];
            let score_csv = [];
            for (let i = 1; i <= maxPlayers; i++) {
                playername_csv.push(document.getElementById("player_name" + i).innerText);
                score_csv.push(document.getElementById("sum_score" + i).innerText);
            }
            try {
                const response = await callGas("saveCsv", [playername_csv, score_csv]);
                if (response && response.success) {
                    alert("CSVデータを出力しました（スプレッドシートに保存されました）");
                } else {
                    alert("保存に失敗しました");
                }
            } catch (error) {
                console.error("Error:", error);
            }
        }

        function startTimer() {
            initAudio();
            try {
                startSound.currentTime = 0;
                startSound.play().catch(e => console.log(e));
            } catch (e) { }
            const btn = document.getElementById('timer_button');
            if (!TimerRunning) {
                TimerRunning = true;
                btn.innerText = "停止";
                btn.className = "danger";
                TimerInterval = setInterval(() => {
                    timeLeft--;
                    const minute = Math.floor(timeLeft / 60);
                    const second = timeLeft % 60;
                    document.getElementById('timer_display').innerText =
                        String(minute).padStart(2, '0') + ":" + String(second).padStart(2, '0');
                    if (timeLeft <= 0) {
                        clearInterval(TimerInterval);
                        TimerRunning = false;
                        btn.innerText = "開始";
                        btn.className = "primary";
                    }
                }, 1000);
            } else {
                TimerRunning = false;
                clearInterval(TimerInterval);
                btn.innerText = "開始";
                btn.className = "primary";
            }
        }

        document.getElementById('player_count_select').value = maxPlayers;
        document.getElementById('judge_count_select').value = judgeCount;
        document.getElementById('timer_count_select').value = defaultTimerMinutes;
        document.getElementById('timer_display').innerText = String(defaultTimerMinutes).padStart(2, '0') + ":00";
        document.getElementById('sound_effect_toggle').checked = enableSpecialSounds;
        document.getElementById('gauge_toggle').checked = showGauge;
        document.getElementById('all_three_hundred_toggle').checked = enableAllThreeIsHundred;
        document.body.setAttribute('data-show-gauge', showGauge);

        const savedSlideInput = localStorage.getItem('savedSlideInput');
        if (savedSlideInput) {
            const input = document.getElementById('slide_url_input');
            if (input) input.value = savedSlideInput;

            const match = savedSlideInput.match(/src="([^"]+)"/);
            if (match && match[1]) {
                const iframe = document.getElementById('slide_iframe');
                if (iframe) iframe.src = match[1];
            }
        }

        renderPons();
        renderPlayers();
        initializeFirebase();
    </script>
</body>

</html>
